# ============================================================
# Docker Compose - Local Development & Simple Deployment
# ============================================================
# Usage:  docker compose up -d --build
# Stop:   docker compose down
# ============================================================

services:
  # --- MongoDB ---
  mongo:
    image: mongo:7
    container_name: drivecloud-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - drivecloud-net

  # --- Backend API ---
  backend:
    build: ./backend
    container_name: drivecloud-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/drivecloud
      - JWT_SECRET=change_this_in_production
      - JWT_REFRESH_SECRET=change_this_refresh_in_production
      - JWT_EXPIRE=7d
      - JWT_REFRESH_EXPIRE=30d
      - UPLOAD_DIR=uploads
      - THUMBNAIL_DIR=thumbnails
      - MAX_FILE_SIZE=104857600
      - DEFAULT_STORAGE_LIMIT=16106127360
      - FRONTEND_URL=http://localhost
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    volumes:
      - upload-data:/app/uploads
      - thumbnail-data:/app/thumbnails
    depends_on:
      - mongo
    networks:
      - drivecloud-net

  # --- Frontend (Nginx) ---
  frontend:
    build: ./frontend
    container_name: drivecloud-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - drivecloud-net

  # --- Prometheus ---
  prometheus:
    image: prom/prometheus:latest
    container_name: drivecloud-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - drivecloud-net

  # --- Grafana ---
  grafana:
    image: grafana/grafana:latest
    container_name: drivecloud-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - drivecloud-net

volumes:
  mongo-data:
  upload-data:
  thumbnail-data:
  prometheus-data:
  grafana-data:

networks:
  drivecloud-net:
    driver: bridge
