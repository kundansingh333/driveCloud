# ============================================================
# Docker Compose - DriveCloud Production Setup
# ============================================================

services:

  # =========================
  # Backend API
  # =========================
  backend:
    build: ./backend
    container_name: drivecloud-backend
    restart: unless-stopped

    ports:
      - "5001:5001"

    environment:
      - PORT=5001
      - NODE_ENV=production

      # MongoDB Atlas
      - MONGODB_URI=mongodb+srv://kundankumarsingh2005_db_user:VOVbjIm3pO8xaaG6@cluster0.zmij82y.mongodb.net/drivecloud?retryWrites=true&w=majority&appName=Cluster0

      # JWT
      - JWT_SECRET=drivecloud_super_secure_jwt_secret_2026
      - JWT_REFRESH_SECRET=drivecloud_refresh_secret_2026
      - JWT_EXPIRE=7d
      - JWT_REFRESH_EXPIRE=30d

      # File Upload
      - UPLOAD_DIR=uploads
      - THUMBNAIL_DIR=thumbnails
      - MAX_FILE_SIZE=104857600
      - DEFAULT_STORAGE_LIMIT=16106127360

      # Frontend URL
      - FRONTEND_URL=http://13.62.58.201

      # SMTP
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}

    volumes:
      - upload-data:/app/uploads
      - thumbnail-data:/app/thumbnails

    networks:
      - drivecloud-net

  # =========================
  # Frontend
  # =========================
  frontend:
    build: ./frontend
    container_name: drivecloud-frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - drivecloud-net

volumes:
  upload-data:
  thumbnail-data:

networks:
  drivecloud-net:
    driver: bridge
