global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # DriveCloud Backend
  - job_name: 'drivecloud-backend'
    metrics_path: /api/health
    static_configs:
      - targets: ['backend:5001']

  # Node Exporter (optional - install on EC2 for OS metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
