apiVersion: apps/v1
kind: Deployment

metadata:
name: frontend-deployment
namespace: drivecloud

spec:
replicas: 1

selector:
matchLabels:
app: frontend

template:
metadata:
labels:
app: frontend


spec:
  containers:
    - name: frontend
      image: kundan333/drivecloud-frontend:latest

      imagePullPolicy: Always

      ports:
        - containerPort: 80

      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 10
        periodSeconds: 10

      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 20
        periodSeconds: 15


---

apiVersion: v1
kind: Service

metadata:
name: frontend-service
namespace: drivecloud

spec:
selector:
app: frontend

ports:
- protocol: TCP
port: 80
targetPort: 80

type: ClusterIP
